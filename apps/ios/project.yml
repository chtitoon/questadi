name: Questadi
options:
  bundleIdPrefix: com.questadi
  deploymentTarget:
    iOS: "17.0"

packages:
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.0.0
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.0.0
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Questadi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Questadi
      - path: ../../packages/api/openapi.yaml
        type: file
    resources:
      - path: Questadi/Resources/Assets.xcassets
      - path: Questadi/Resources/Fonts
    dependencies:
      - target: QuestadWidget
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    preBuildScripts:
      - name: Generate Design Tokens
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          node "${SRCROOT}/scripts/generate-tokens.js"
        outputFiles:
          - $(SRCROOT)/Questadi/App/DesignTokens.swift
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: swift-openapi-generator
    info:
      path: Questadi/Info.plist
      properties:
        CFBundleDisplayName: Questadi
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - questadi
        API_BASE_URL: "http://localhost:3000"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: "Used to suggest who said a quote."
        UIAppFonts:
          - "Nunito[wght].ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.questadi.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  QuestadWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuestadWidget
    info:
      path: QuestadWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.questadi.app.widget
        TARGETED_DEVICE_FAMILY: "1"
